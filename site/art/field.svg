<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Функциональный интеграл в sci-fi стиле">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020814"/>
      <stop offset="0.45" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#143567"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#91cbff" stop-opacity=".95"/>
      <stop offset="0.35" stop-color="#91cbff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#91cbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#95ffe2" stop-opacity=".98"/>
      <stop offset="0.32" stop-color="#95ffe2" stop-opacity=".4"/>
      <stop offset="1" stop-color="#95ffe2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quasar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c5"/>
      <stop offset="0.2" stop-color="#ffe08d"/>
      <stop offset="0.42" stop-color="#ffd15f" stop-opacity=".75"/>
      <stop offset="0.72" stop-color="#95ffe222"/>
      <stop offset="1" stop-color="#95ffe200"/>
    </radialGradient>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="blur5" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5.2"/></filter>
  </defs>

  <rect width="420" height="270" rx="22" fill="url(#bg)"/>

  <!-- techno grid -->
  <g opacity=".11" stroke="#b8d8ff">
    <path d="M0 45H420M0 90H420M0 135H420M0 180H420M0 225H420"/>
    <path d="M42 0V270M84 0V270M126 0V270M168 0V270M210 0V270M252 0V270M294 0V270M336 0V270M378 0V270"/>
  </g>

  <!-- stars -->
  <g opacity=".95">
    <circle cx="28" cy="23" r="1.1" fill="#fff"/><circle cx="51" cy="79" r="1.4" fill="#cfe4ff"/>
    <circle cx="88" cy="31" r="1.2" fill="#fff"/><circle cx="113" cy="56" r="1.4" fill="#95ffe2"/>
    <circle cx="151" cy="20" r="1.1" fill="#fff"/><circle cx="174" cy="63" r="1.3" fill="#cfe4ff"/>
    <circle cx="213" cy="27" r="1.3" fill="#fff"/><circle cx="246" cy="68" r="1.2" fill="#95ffe2"/>
    <circle cx="282" cy="26" r="1.1" fill="#fff"/><circle cx="309" cy="58" r="1.4" fill="#cfe4ff"/>
    <circle cx="352" cy="29" r="1.1" fill="#fff"/><circle cx="390" cy="46" r="1.4" fill="#95ffe2"/>
    <circle cx="39" cy="123" r="1.1" fill="#fff"/><circle cx="91" cy="101" r="1.4" fill="#cfe4ff"/>
    <circle cx="331" cy="106" r="1.2" fill="#fff"/><circle cx="384" cy="129" r="1.3" fill="#95ffe2"/>
    <circle cx="21" cy="217" r="1.1" fill="#fff"/><circle cx="74" cy="241" r="1.4" fill="#cfe4ff"/>
    <circle cx="134" cy="228" r="1.1" fill="#fff"/><circle cx="307" cy="231" r="1.2" fill="#fff"/>
    <circle cx="396" cy="220" r="1.4" fill="#95ffe2"/>
  </g>

  <!-- quasar / black hole left -->
  <g transform="translate(72 66)">
    <circle cx="0" cy="0" r="34" fill="url(#quasar)" filter="url(#blur5)"/>
    <ellipse cx="0" cy="0" rx="56" ry="16" transform="rotate(-18)" fill="none" stroke="#ffd46a" stroke-opacity=".55" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="68" ry="9" transform="rotate(-18)" fill="none" stroke="#cce4ff" stroke-opacity=".16" stroke-width="9"/>
    <circle cx="0" cy="0" r="17" fill="#01050d"/>
    <circle cx="0" cy="0" r="11" fill="#000"/>
    <path d="M0 -53 L-7 -16 L7 -16 Z" fill="#dff1ff" opacity=".52"/>
    <path d="M0 53 L-7 16 L7 16 Z" fill="#dff1ff" opacity=".40"/>
  </g>

  <!-- quasar / black hole right -->
  <g transform="translate(347 194)">
    <circle cx="0" cy="0" r="28" fill="url(#quasar)" filter="url(#blur2)"/>
    <ellipse cx="0" cy="0" rx="45" ry="13" transform="rotate(24)" fill="none" stroke="#95ffe2" stroke-opacity=".42" stroke-width="4"/>
    <circle cx="0" cy="0" r="15" fill="#01050d"/>
    <circle cx="0" cy="0" r="10" fill="#000"/>
  </g>

  <!-- feynman diagrams -->
  <g fill="none" stroke-linecap="round" stroke-width="2.2">
    <g transform="translate(322 60)">
      <path d="M-38 -18 Q-17 -31 0 -6 T38 -18" stroke="#d7e8ff"/>
      <path d="M-38 18 Q-17 5 0 30 T38 18" stroke="#d7e8ff"/>
      <path d="M0 -6 C8 -1 8 24 0 30 C-8 24 -8 -1 0 -6Z" stroke="#95ffe2" stroke-dasharray="1 6"/>
      <circle cx="-38" cy="-18" r="2.4" fill="#fff" stroke="none"/>
      <circle cx="-38" cy="18" r="2.4" fill="#fff" stroke="none"/>
      <circle cx="38" cy="-18" r="2.4" fill="#fff" stroke="none"/>
      <circle cx="38" cy="18" r="2.4" fill="#fff" stroke="none"/>
    </g>
    <g transform="translate(90 207)">
      <path d="M-43 0 Q-18 -20 0 0 T43 0" stroke="#d7e8ff"/>
      <path d="M0 0 C10 12 10 28 0 39 C-10 28 -10 12 0 0Z" stroke="#95ffe2" stroke-dasharray="1 6"/>
      <path d="M0 39 Q18 57 41 53" stroke="#d7e8ff"/>
      <circle cx="-43" cy="0" r="2.3" fill="#fff" stroke="none"/>
      <circle cx="43" cy="0" r="2.3" fill="#fff" stroke="none"/>
      <circle cx="41" cy="53" r="2.3" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- holographic rings behind the formula -->
  <g opacity=".55" fill="none">
    <ellipse cx="210" cy="145" rx="145" ry="55" stroke="#91cbff33" stroke-width="1.5"/>
    <ellipse cx="210" cy="145" rx="160" ry="69" stroke="#95ffe233" stroke-width="1.1"/>
    <path d="M70 145H350" stroke="#cfe4ff18"/>
    <path d="M210 80V212" stroke="#cfe4ff18"/>
  </g>

  <!-- formula -->
  <g transform="translate(0 4)">
    <text x="210" y="154" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="57" font-style="italic" fill="#f7fbff">∫ 𝒟φ e<tspan dy="-18" font-size="34">iS[φ]</tspan></text>
  </g>

  <!-- subtle sci-fi glows -->
  <circle cx="210" cy="145" r="92" fill="url(#cyanGlow)" opacity=".07"/>
  <circle cx="210" cy="145" r="112" fill="url(#mintGlow)" opacity=".06"/>
</svg>
